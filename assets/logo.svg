<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PARACUDA-NG">
  <title>PARACUDA-NG</title>
  <defs>
    <linearGradient id="pcTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b8a2"/>
      <stop offset="1" stop-color="#00695f"/>
    </linearGradient>
    <clipPath id="pcFront">
      <path d="M18 30 H40 V50 H18 Z"/>
    </clipPath>
  </defs>

  <!-- Tile. A filled ground keeps the mark legible on light and dark pages. -->
  <rect width="64" height="64" rx="15" fill="url(#pcTile)"/>

  <!-- Data cube: the top face carries the spectral bands, the front face the
       reflectance curve. -->
  <g>
    <!-- top face, split into four band strips -->
    <path d="M18 30 L28 20 H33.5 L23.5 30 Z" fill="#a78bfa"/>
    <path d="M23.5 30 L33.5 20 H39 L29 30 Z" fill="#38bdf8"/>
    <path d="M29 30 L39 20 H44.5 L34.5 30 Z" fill="#4ade80"/>
    <path d="M34.5 30 L44.5 20 H50 L40 30 Z" fill="#fbbf24"/>

    <!-- right face -->
    <path d="M40 30 L50 20 V40 L40 50 Z" fill="#04120f" fill-opacity=".22"/>
    <!-- front face -->
    <path d="M18 30 H40 V50 H18 Z" fill="#ffffff" fill-opacity=".12"/>

    <!-- reflectance curve with an absorption dip, clipped to the front face -->
    <g clip-path="url(#pcFront)">
      <path d="M18 46.5 C22 45 23.5 37.5 27 37.5 C29.6 37.5 29.8 44.5 32 44.5 C34.6 44.5 35.5 35.5 40 33.5"
            fill="none" stroke="#ffffff" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- cube edges -->
    <path d="M18 30 L28 20 H50 L40 30 Z M18 30 H40 V50 H18 Z M40 30 L50 20 V40 L40 50"
          fill="none" stroke="#ffffff" stroke-opacity=".92" stroke-width="2.2"
          stroke-linejoin="round"/>
  </g>
</svg>
